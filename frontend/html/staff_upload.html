<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เจ้าหน้าที่ - ระบบรับส่งเอกสาร (e-Mailbox V1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }
    body {
      background-color: #FAF8F5;
      color: #3D3730;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    input::placeholder {
      color: #9E9689 !important;
    }
  </style>
</head>
<body class="bg-[#FAF8F5]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;
    const API_BASE_URL = ['null', 'http://localhost:5500', 'http://127.0.0.1:5500'].includes(window.location.origin)
      ? 'http://localhost:5000'
      : window.location.origin;

    // --- Trie Search Helpers ---
    function walkTrie(trieData, prefix) {
      if (!trieData || !prefix) return null;
      const chars = prefix.toLowerCase().split('');
      let node = trieData;
      for (const ch of chars) {
        if (!node[ch]) return new Set();
        node = node[ch];
      }
      return collectTrieIds(node);
    }

    function collectTrieIds(node) {
      const ids = new Set(node['$'] || []);
      for (const [key, child] of Object.entries(node)) {
        if (key !== '$') {
          for (const id of collectTrieIds(child)) ids.add(id);
        }
      }
      return ids;
    }

    // --- Highlight Text Helper ---
    function HighlightText({ text, query }) {
      if (!text) return '-';
      if (!query || !query.trim()) return text;

      const words = query.trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return text;

      const escaped = words.map(w => w.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&')).join('|');
      const regex = new RegExp(`(${escaped})`, 'gi');
      const parts = String(text).split(regex);

      return (
        <span>
          {parts.map((part, index) => {
            const isMatch = words.some(w => w.toLowerCase() === part.toLowerCase());
            return isMatch ? (
              <mark key={index} className="bg-[#F5E6B3] text-[#2B251F] font-medium px-0.5 rounded-xs">
                {part}
              </mark>
            ) : (
              part
            );
          })}
        </span>
      );
    }

    function StaffDocumentIngestion() {
      const [formData, setFormData] = useState({
        title: '',
        receivedDate: new Date().toISOString().split('T')[0],
        recipientName: '',
        senderName: ''
      });

      // --- Document Search State ---
      const [docSearchQuery, setDocSearchQuery] = useState('');
      const [trieData, setTrieData] = useState(null);
      const [existingDocs, setExistingDocs] = useState([]);
      const [searchResults, setSearchResults] = useState([]);
      const [showSearchResults, setShowSearchResults] = useState(false);

      const [uploadedFiles, setUploadedFiles] = useState([]);
      const [activeFileId, setActiveFileId] = useState(null);

      const [isPdf, setIsPdf] = useState(false);
      const [isImage, setIsImage] = useState(false);
      const [pdfDoc, setPdfDoc] = useState(null);
      const [isPreviewActive, setIsPreviewActive] = useState(false);

      const [zoom, setZoom] = useState(100);
      const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      const [currentPage, setCurrentPage] = useState(1);
      const [totalPages, setTotalPages] = useState(1);

      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toast, setToast] = useState({ show: false, type: '', title: '', subtitle: '' });

      const fileInputRef = useRef(null);
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      const allowedExtensions = ['pdf', 'png', 'jpg', 'jpeg'];

      // Fetch trie + documents for search
      useEffect(() => {
        fetch(`${API_BASE_URL}/api/v1/search/trie`)
          .then(r => r.json())
          .then(data => setTrieData(data.trie))
          .catch(() => {});
        fetch(`${API_BASE_URL}/api/v1/documents`)
          .then(r => r.json())
          .then(data => setExistingDocs(data.documents || []))
          .catch(() => {});
      }, []);

      // Filter search results
      useEffect(() => {
        const trimmed = docSearchQuery.trim();
        if (!trimmed) {
          setSearchResults([]);
          setShowSearchResults(false);
          return;
        }
        const words = trimmed.toLowerCase().split(/\s+/);
        let resultSet = null;
        for (const word of words) {
          const ids = walkTrie(trieData, word);
          if (ids === null) continue;
          if (resultSet === null) {
            resultSet = ids;
          } else {
            resultSet = new Set([...resultSet].filter(id => ids.has(id)));
          }
        }
        if (resultSet) {
          setSearchResults(existingDocs.filter(d => resultSet.has(d.id)));
        } else {
          setSearchResults([]);
        }
        setShowSearchResults(true);
      }, [docSearchQuery, trieData, existingDocs]);

      const handleInputChange = (field, value) => {
        setFormData(prev => ({ ...prev, [field]: value }));
      };

      const showToast = (type, title, subtitle = '') => {
        setToast({ show: true, type, title, subtitle });
        setTimeout(() => {
          setToast({ show: false, type: '', title: '', subtitle: '' });
        }, 4000);
      };

      const renderPdfPage = useCallback(async (pageNumber, doc) => {
        if (!doc || !canvasRef.current) return;
        try {
          const page = await doc.getPage(pageNumber);
          const canvas = canvasRef.current;
          const context = canvas.getContext('2d');
          const baseScale = 1.35;
          const viewport = page.getViewport({ scale: baseScale });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        } catch (err) {
          console.error('Error rendering PDF page:', err);
        }
      }, []);

      const processFiles = (newFiles) => {
        if (!newFiles || newFiles.length === 0) return;

        const fileList = Array.from(newFiles);
        let hasInvalid = false;

        const processedList = fileList.map((file, idx) => {
          const parts = file.name.split('.');
          const ext = parts.length > 1 ? parts.pop().toLowerCase() : '';
          const isValid = allowedExtensions.includes(ext);
          if (!isValid) hasInvalid = true;

          return {
            id: `${Date.now()}-${idx}-${Math.random().toString(36).substr(2, 9)}`,
            file: file,
            name: file.name,
            ext: ext,
            url: isValid ? URL.createObjectURL(file) : null,
            isUnsupported: !isValid
          };
        });

        setUploadedFiles(prev => [...prev, ...processedList]);

        if (hasInvalid) {
          showToast('error', 'Error บันทึกไม่สำเร็จ', 'กรอกรายละเอียดไม่ครบ/ไฟล์ไม่ถูกต้อง');
        }

        const firstValid = processedList.find(f => !f.isUnsupported);
        if (firstValid) {
          loadDocumentPreview(firstValid);
        }
      };

      const loadDocumentPreview = async (item) => {
        if (!item || item.isUnsupported) return;

        setActiveFileId(item.id);
        setIsPreviewActive(true);
        setZoom(100);
        setPanOffset({ x: 0, y: 0 });
        setCurrentPage(1);

        if (item.ext === 'pdf') {
          setIsPdf(true);
          setIsImage(false);
          try {
            if (window.pdfjsLib) {
              const arrayBuffer = await item.file.arrayBuffer();
              const doc = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
              setPdfDoc(doc);
              setTotalPages(doc.numPages);
              renderPdfPage(1, doc);
            }
          } catch (pdfErr) {
            setTotalPages(1);
          }
        } else {
          setIsPdf(false);
          setIsImage(true);
          setPdfDoc(null);
          setTotalPages(1);
        }
      };

      useEffect(() => {
        if (isPdf && pdfDoc && isPreviewActive) {
          renderPdfPage(currentPage, pdfDoc);
        }
      }, [isPdf, pdfDoc, currentPage, isPreviewActive, renderPdfPage]);

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          processFiles(e.target.files);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const handleDragOver = (e) => e.preventDefault();
      const handleDrop = (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          processFiles(e.dataTransfer.files);
        }
      };

      const handleRemoveFile = (idToRemove, e) => {
        e.stopPropagation();
        setUploadedFiles(prev => {
          const filtered = prev.filter(f => f.id !== idToRemove);
          if (activeFileId === idToRemove) {
            const nextValid = filtered.find(f => !f.isUnsupported);
            if (nextValid) {
              loadDocumentPreview(nextValid);
            } else {
              setIsPreviewActive(false);
              setActiveFileId(null);
              setPdfDoc(null);
            }
          }
          return filtered;
        });
      };

      const handleZoomIn = () => setZoom(prev => Math.min(prev + 25, 200));
      const handleZoomOut = () => setZoom(prev => Math.max(prev - 25, 50));
      const handleClosePreview = () => {
        setIsPreviewActive(false);
        setActiveFileId(null);
        setPanOffset({ x: 0, y: 0 });
      };

      const handlePrevPage = () => {
        if (currentPage > 1) setCurrentPage(prev => prev - 1);
      };
      const handleNextPage = () => {
        if (currentPage < totalPages) setCurrentPage(prev => prev + 1);
      };

      const handleMouseDown = (e) => {
        if (!isPreviewActive) return;
        setIsDragging(true);
        setDragStart({ x: e.clientX - panOffset.x, y: e.clientY - panOffset.y });
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        setPanOffset({
          x: e.clientX - dragStart.x,
          y: e.clientY - dragStart.y
        });
      };

      const handleMouseUp = () => {
        setIsDragging(false);
      };

      const hasAnyUnsupported = uploadedFiles.some(f => f.isUnsupported);
      const isFormValid =
        formData.title.trim() !== '' &&
        formData.receivedDate.trim() !== '' &&
        formData.recipientName.trim() !== '' &&
        formData.senderName.trim() !== '' &&
        uploadedFiles.length > 0 &&
        !hasAnyUnsupported;

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        if (!isFormValid) {
          showToast('error', 'Error บันทึกไม่สำเร็จ', 'กรอกรายละเอียดไม่ครบ/ไฟล์ไม่ถูกต้อง');
          return;
        }

        setIsSubmitting(true);

        const payload = new FormData();
        payload.append('title', formData.title);
        payload.append('document_date', formData.receivedDate);
        payload.append('receiver', formData.recipientName);
        payload.append('sender', formData.senderName);
        payload.append('file', uploadedFiles[0].file);

        try {
          const response = await fetch(`${API_BASE_URL}/api/v1/documents`, {
            method: 'POST',
            body: payload
          });

          if (response.ok) {
            showToast('success', 'บันทึกสำเร็จ');
            resetForm();
          } else {
            const errorData = await response.json().catch(() => ({}));
            showToast(
              'error',
              'Error บันทึกไม่สำเร็จ',
              errorData.error?.message || `HTTP ${response.status}`
            );
          }
        } catch (error) {
          showToast('error', 'Error บันทึกไม่สำเร็จ', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
        }

        setIsSubmitting(false);
      };

      const resetForm = () => {
        setFormData({
          title: '',
          receivedDate: new Date().toISOString().split('T')[0],
          recipientName: '',
          senderName: ''
        });
        setUploadedFiles([]);
        setActiveFileId(null);
        setIsPdf(false);
        setIsImage(false);
        setPdfDoc(null);
        setIsPreviewActive(false);
        setPanOffset({ x: 0, y: 0 });
        setZoom(100);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const mockFillValid = () => {
        setFormData({
          title: 'หนังสือขออนุมัติจัดโครงการสัมมนาเชิงปฏิบัติการ',
          receivedDate: '2026-08-30',
          recipientName: 'ดร.สมชาย ใจดี',
          senderName: 'สำนักงานคณบดี'
        });
        const mockBlob = new Blob([
          `%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj 2 0 obj<</Type/Pages/Count 1/Kids[3 0 R]>>endobj 3 0 obj<</Type/Page/MediaBox[0 0 595 842]/Parent 2 0 R/Resources<<>>>>endobj\nxref\n0 4\n0000000000 65535 f\n0000000010 00000 n\n0000000053 00000 n\n0000000102 00000 n\ntrailer<</Size 4/Root 1 0 R>>\nstartxref\n185\n%%EOF`
        ], { type: 'application/pdf' });
        const mockFile = new File([mockBlob], "File1.pdf", { type: "application/pdf" });
        processFiles([mockFile]);
      };

      const mockFillInvalid = () => {
        setFormData({
          title: 'เอกสารแนบโปรแกรม C',
          receivedDate: '2026-08-30',
          recipientName: 'ผศ.ดร.วิชัย เก่งการ',
          senderName: 'ภาควิชาวิทยาการคอมพิวเตอร์'
        });
        const mockBadFile = new File(["main() {}"], "File1.c", { type: "text/plain" });
        processFiles([mockBadFile]);
      };

      const activeFile = uploadedFiles.find(f => f.id === activeFileId);

      return (
        <div className="min-h-screen w-full bg-[#FAF8F5] flex flex-col md:flex-row font-['Prompt',sans-serif] text-[#3D3730] relative overflow-x-hidden">
          {/* Quick Demo Toolbar */}
          <div className="fixed bottom-3 right-4 z-40 bg-white/95 backdrop-blur border border-[#D5CEC4] rounded-xl px-3 py-2 shadow-md flex items-center gap-2 text-xs">
            <span className="text-[#70675D] font-medium">Quick Demo:</span>
            <a
              href="lecturer_view.html"
              className="bg-[#EFECE6] text-[#70675D] px-2.5 py-1 rounded-lg hover:bg-[#E2DDD5] transition"
            >
              User
            </a>
            <a
              href="staff_upload.html"
              className="bg-[#8C8176] text-white px-2.5 py-1 rounded-lg transition"
            >
              Admin
            </a>
            <button
              onClick={mockFillValid}
              className="bg-[#8C8176] text-white px-2.5 py-1 rounded-lg hover:bg-[#7A7067] transition"
            >
              Fill Valid Form
            </button>
            <button
              onClick={mockFillInvalid}
              className="bg-[#E08A8A] text-white px-2.5 py-1 rounded-lg hover:bg-[#C97272] transition"
            >
              Test Invalid File (.c)
            </button>
            <button
              onClick={() => showToast('success', 'บันทึกสำเร็จ')}
              className="bg-[#6BBF72] text-white px-2.5 py-1 rounded-lg hover:bg-[#5AA860] transition"
            >
              Test Success Toast
            </button>
            <button
              onClick={() => showToast('error', 'Error บันทึกไม่สำเร็จ', 'กรอกรายละเอียดไม่ครบ/ไฟล์ไม่ถูกต้อง')}
              className="bg-[#F87171] text-white px-2.5 py-1 rounded-lg hover:bg-[#DE5E5E] transition"
            >
              Test Error Toast
            </button>
          </div>

          {toast.show && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform scale-100">
              {toast.type === 'success' ? (
                <div id="success-toast" className="bg-[#6BBF72] text-white px-8 py-3.5 rounded-2xl shadow-lg flex items-center gap-3 min-w-[260px] justify-center">
                  <span className="text-xl font-bold flex items-center justify-center w-6 h-6 border-2 border-white rounded-full text-xs">✓</span>
                  <span className="text-base font-normal tracking-wide">{toast.title}</span>
                </div>
              ) : (
                <div id="error-toast" className="bg-[#F87171] text-white px-7 py-3 rounded-2xl shadow-lg flex items-center gap-4 min-w-[320px]">
                  <span className="text-2xl font-light leading-none">✕</span>
                  <div className="flex flex-col">
                    <span className="text-sm font-medium">{toast.title}</span>
                    <span className="text-xs text-white/90 font-light">{toast.subtitle}</span>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Left Form Area with Sticky Bottom Action */}
          <div className="w-full md:w-[35%] lg:w-[33%] h-screen bg-[#FAF8F5] p-6 sm:p-10 flex flex-col justify-between border-r border-[#EFECE6] shrink-0 sticky top-0">
            <div className="overflow-y-auto pr-1 flex-1 space-y-6">
              <h1 className="text-2xl sm:text-3xl font-normal text-[#4A433B]">เจ้าหน้าที่</h1>

              <div>
                <label className="block text-sm text-[#70675D] mb-2 font-normal">รายละเอียดเอกสาร*</label>
                <div className="space-y-3">
                  <input
                    id="input-title"
                    type="text"
                    placeholder="ชื่อเรื่อง/เลขที่เอกสาร*"
                    value={formData.title}
                    onChange={e => handleInputChange('title', e.target.value)}
                    className="w-full bg-[#F1EDE6] text-[#3D3730] placeholder-[#9E9689] px-4 py-3 rounded-xl border border-transparent focus:border-[#C8C1B6] focus:bg-[#EBE6DE] focus:outline-none transition text-sm"
                  />

                  <input
                    id="input-date"
                    type="date"
                    placeholder="วันที่รับ*"
                    value={formData.receivedDate}
                    onChange={e => handleInputChange('receivedDate', e.target.value)}
                    className="w-full bg-[#F1EDE6] text-[#3D3730] placeholder-[#9E9689] px-4 py-3 rounded-xl border border-transparent focus:border-[#C8C1B6] focus:bg-[#EBE6DE] focus:outline-none transition text-sm"
                  />

                  <input
                    id="input-recipient"
                    type="text"
                    placeholder="อาจารย์ผู้รับ*"
                    value={formData.recipientName}
                    onChange={e => handleInputChange('recipientName', e.target.value)}
                    className="w-full bg-[#F1EDE6] text-[#3D3730] placeholder-[#9E9689] px-4 py-3 rounded-xl border border-transparent focus:border-[#C8C1B6] focus:bg-[#EBE6DE] focus:outline-none transition text-sm"
                  />

                  <input
                    id="input-sender"
                    type="text"
                    placeholder="ผู้ส่ง/หน่วยงาน*"
                    value={formData.senderName}
                    onChange={e => handleInputChange('senderName', e.target.value)}
                    className="w-full bg-[#F1EDE6] text-[#3D3730] placeholder-[#9E9689] px-4 py-3 rounded-xl border border-transparent focus:border-[#C8C1B6] focus:bg-[#EBE6DE] focus:outline-none transition text-sm"
                  />
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between">
                  <label className="block text-sm text-[#70675D] font-normal">ไฟล์เอกสาร*</label>
                  {uploadedFiles.length > 0 && (
                    <span className="text-xs text-[#70675D]">({uploadedFiles.length} ไฟล์)</span>
                  )}
                </div>
                {/* Document Search */}
                <div className="relative mt-2 mb-1">
                  <div className="flex items-center gap-2 bg-[#F1EDE6] rounded-xl px-3 py-2 border border-transparent focus-within:border-[#C8C1B6] focus-within:bg-[#EBE6DE] transition">
                    <svg className="w-3.5 h-3.5 text-[#9E9689] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                    <input
                      type="text"
                      value={docSearchQuery}
                      onChange={e => setDocSearchQuery(e.target.value)}
                      placeholder="ค้นหาเอกสาร..."
                      className="w-full bg-transparent text-[#3D3730] placeholder-[#9E9689] text-xs focus:outline-none"
                    />
                    {docSearchQuery && (
                      <button
                        type="button"
                        onClick={() => setDocSearchQuery('')}
                        className="text-[#9E9689] hover:text-[#3D3730] text-xs cursor-pointer"
                      >
                        ✕
                      </button>
                    )}
                  </div>
                  {showSearchResults && (
                    <div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-[#E5E0D8] rounded-xl shadow-lg max-h-48 overflow-y-auto">
                      {searchResults.length === 0 ? (
                        <p className="text-xs text-[#9E9689] p-3 text-center">ไม่พบเอกสาร</p>
                      ) : (
                        searchResults.map(doc => (
                          <div
                            key={doc.id}
                            className="px-3 py-2 hover:bg-[#FAF8F5] cursor-pointer border-b border-[#EFECE6] last:border-b-0 transition"
                            onClick={() => {
                              setDocSearchQuery('');
                              setShowSearchResults(false);
                              window.open(`${API_BASE_URL}/api/v1/documents/${doc.id}/file`, '_blank');
                            }}
                          >
                            <p className="text-xs text-[#3D3730] font-normal truncate">
                              <HighlightText text={doc.title} query={docSearchQuery} />
                            </p>
                            <p className="text-[10px] text-[#9E9689] font-light">
                              <HighlightText text={doc.sender} query={docSearchQuery} /> → <HighlightText text={doc.receiver} query={docSearchQuery} />
                            </p>
                          </div>
                        ))
                      )}
                    </div>
                  )}
                </div>

                <p className="text-xs text-red-500 font-light mt-1 mb-2">
                  * รองรับเฉพาะไฟล์ .pdf, .png, .jpg, .jpeg เท่านั้น
                </p>

                <input
                  type="file"
                  ref={fileInputRef}
                  onChange={handleFileChange}
                  accept=".pdf,.png,.jpg,.jpeg,*"
                  multiple
                  className="hidden"
                />

                <div className="flex flex-wrap items-center gap-3">
                  <div
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    onDragOver={handleDragOver}
                    onDrop={handleDrop}
                    className="w-24 h-32 rounded-xl border border-[#D5CEC4] bg-white flex flex-col items-center justify-center cursor-pointer hover:border-[#8C8176] hover:bg-[#FAF8F5] transition group shrink-0"
                    title="คลิกหรือลากไฟล์มาเพิ่ม (.pdf, .png, .jpg)"
                  >
                    <span className="text-3xl text-[#9E9689] group-hover:text-[#6B6257] font-light transition">+</span>
                    <span className="text-[10px] text-[#9E9689] mt-1">เพิ่มไฟล์</span>
                  </div>

                  {uploadedFiles.map((item) => {
                    const isActive = activeFileId === item.id;
                    return (
                      <div
                        key={item.id}
                        className={`w-24 h-32 rounded-xl border bg-white flex flex-col items-center justify-between p-2.5 shadow-sm shrink-0 transition relative group ${
                          isActive ? 'border-[#8C8176] ring-1 ring-[#8C8176]' : 'border-[#E5E0D8]'
                        }`}
                      >
                        <button
                          type="button"
                          onClick={(e) => handleRemoveFile(item.id, e)}
                          className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-[#E08A8A] hover:bg-[#C97272] text-white rounded-full flex items-center justify-center text-[10px] font-bold shadow transition cursor-pointer"
                          title="ลบไฟล์นี้"
                        >
                          ✕
                        </button>

                        <span className="text-[11px] text-[#70675D] font-normal text-center truncate w-full pt-1" title={item.name}>
                          {item.name}
                        </span>

                        {item.isUnsupported ? (
                          <div className="w-full border border-[#E08A8A] bg-[#FFF5F5] rounded-md py-1 px-1 text-center">
                            <span className="text-[10px] text-[#D9534F] font-light block leading-tight">เอกสารไม่ถูกต้อง</span>
                          </div>
                        ) : (
                          <button
                            type="button"
                            onClick={() => loadDocumentPreview(item)}
                            className={`w-full border rounded-md py-1 px-1 text-center transition cursor-pointer ${
                              isActive
                                ? 'bg-[#8C8176] text-white border-[#8C8176]'
                                : 'border-[#C8C1B6] hover:border-[#8C8176] hover:bg-[#F5F2EC] text-[#554E45]'
                            }`}
                          >
                            <span className="text-[11px] font-light">
                              {isActive ? 'กำลังดู' : 'ดูเอกสาร'}
                            </span>
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Sticky Bottom Action Button */}
            <div className="pt-4 pb-2 mt-auto border-t border-[#EFECE6] bg-[#FAF8F5] shrink-0 sticky bottom-0">
              <button
                type="button"
                onClick={handleSubmit}
                disabled={isSubmitting || !isFormValid}
                className={`w-full py-3.5 px-4 rounded-xl font-normal text-sm transition duration-200 flex items-center justify-center gap-2 ${
                  isSubmitting
                    ? 'bg-[#8C8176] text-white opacity-90 cursor-wait'
                    : isFormValid
                    ? 'bg-[#8C8176] hover:bg-[#7A7067] text-white shadow-sm cursor-pointer'
                    : 'bg-[#EFECE6] text-[#A39B90] cursor-not-allowed'
                }`}
              >
                {isSubmitting ? (
                  <>
                    <svg className="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>กำลังบันทึกเอกสาร...</span>
                  </>
                ) : (
                  <span>บันทึกเอกสาร</span>
                )}
              </button>
            </div>
          </div>

          {/* Right Canvas Area with Pan & Zoom */}
          <div
            className="w-full md:w-[65%] lg:w-[67%] h-screen max-h-screen bg-[#F4F2EE] flex flex-col items-center justify-start pt-3 sm:pt-4 pb-3 px-4 relative overflow-hidden select-none"
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
          >
            <div className="h-[84vh] max-h-[820px] w-auto aspect-[1/1.414] max-w-full flex flex-col items-center">
              {/* Top Canvas Controls */}
              <div className="w-full flex items-center justify-between text-xs text-[#70675D] px-1 py-1 mb-1 shrink-0">
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleZoomOut}
                    disabled={zoom <= 50}
                    className="hover:text-black px-2 py-1 rounded hover:bg-[#EAE6DE] cursor-pointer disabled:opacity-30"
                    title="ย่อ"
                  >
                    -
                  </button>
                  <span className="min-w-[42px] text-center font-light">{zoom}%</span>
                  <button
                    type="button"
                    onClick={handleZoomIn}
                    disabled={zoom >= 200}
                    className="hover:text-black px-2 py-1 rounded hover:bg-[#EAE6DE] cursor-pointer disabled:opacity-30"
                    title="ขยาย"
                  >
                    +
                  </button>
                  {zoom !== 100 && (
                    <button
                      type="button"
                      onClick={() => { setZoom(100); setPanOffset({ x: 0, y: 0 }); }}
                      className="text-[10px] text-[#70675D] hover:text-black underline ml-1 cursor-pointer"
                      title="รีเซ็ตขนาด"
                    >
                      รีเซ็ต
                    </button>
                  )}
                </div>

                <div className="flex items-center gap-2">
                  {totalPages > 1 && (
                    <button
                      type="button"
                      onClick={handlePrevPage}
                      disabled={currentPage <= 1}
                      className="hover:text-black px-1.5 py-0.5 rounded hover:bg-[#EAE6DE] disabled:opacity-30 cursor-pointer"
                    >
                      ◀
                    </button>
                  )}
                  <span>หน้า {currentPage} จาก {totalPages}</span>
                  {totalPages > 1 && (
                    <button
                      type="button"
                      onClick={handleNextPage}
                      disabled={currentPage >= totalPages}
                      className="hover:text-black px-1.5 py-0.5 rounded hover:bg-[#EAE6DE] disabled:opacity-30 cursor-pointer"
                    >
                      ▶
                    </button>
                  )}
                </div>

                <button
                  type="button"
                  onClick={handleClosePreview}
                  className="text-[#70675D] hover:text-black hover:bg-[#EAE6DE] px-2 py-1 rounded cursor-pointer"
                  title="ปิดการดูตัวอย่าง"
                >
                  ✕
                </button>
              </div>

              {/* True Portrait A4 Canvas Container */}
              <div
                ref={containerRef}
                onMouseDown={handleMouseDown}
                className={`w-full flex-1 bg-white rounded shadow-sm border border-[#E5E0D8] relative overflow-hidden flex items-center justify-center ${
                  isPreviewActive ? (isDragging ? 'cursor-grabbing' : 'cursor-grab') : ''
                }`}
              >
                {isPreviewActive && activeFile && !activeFile.isUnsupported ? (
                  <div
                    className="w-full h-full flex items-center justify-center p-2 transition-transform duration-75 origin-center"
                    style={{
                      transform: `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoom / 100})`
                    }}
                  >
                    {isPdf ? (
                      <canvas ref={canvasRef} className="max-w-full max-h-full object-contain shadow-xs bg-white pointer-events-none" />
                    ) : isImage && activeFile.url ? (
                      <img
                        src={activeFile.url}
                        alt="Preview"
                        className="max-w-full max-h-full object-contain shadow-xs pointer-events-none"
                      />
                    ) : null}
                  </div>
                ) : (
                  <span className="text-2xl sm:text-3xl font-light tracking-wide text-[#70675D]">
                    Preview เอกสาร
                  </span>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StaffDocumentIngestion />);
  </script>
</body>
</html>
