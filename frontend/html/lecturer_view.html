  <!-- Auth guard: redirect to login if no session -->
  <script>
    (function () {
      var AUTH_KEY = 'emb_session';
      try {
        var raw = sessionStorage.getItem(AUTH_KEY);
        if (!raw) { window.location.replace('login.html'); }
        var s = JSON.parse(raw);
        if (!s || !s.role) { window.location.replace('login.html'); }
      } catch (e) { window.location.replace('login.html'); }
    })();
  </script>

    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: #FAF8F5;
      color: #3D3730;
      margin: 0;

    @keyframes fadeIn {

        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    @keyframes shimmer {
      0% {
        opacity: 0.5;
      }

      50% {
        opacity: 0.9;
      }

        opacity: 0.5;
      }
    }

    .skeleton-pill {
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* ===== NAVBAR ===== */
    .emb-navbar {
      position: sticky;
      top: 0;
      z-index: 30;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #EFECE6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 56px;
      box-shadow: 0 1px 12px rgba(60, 50, 40, 0.06);
    }

    .emb-navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #2B251F;
    }

    .emb-navbar-icon {
      width: 32px;
      height: 32px;
      background: #2B251F;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .emb-navbar-icon svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .emb-navbar-title {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.2px;

    }

    .emb-navbar-right {
      display: flex;

    .emb-navbar-name {

    /* ===== ACCESS DENIED TOAST ===== */
    .emb-toast {

      transform: translateX(-50%) translateY(-8px);
      z-index: 100;

      font-weight: 300;
      padding: 10px 20px;
      border-radius: 100px;
      box-shadow: 0 4px 20px rgba(43, 37, 31, 0.25);

      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;

    }

    .emb-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .emb-toast-icon {

    @media (max-width: 600px) {
      .emb-navbar {
        padding: 0 16px;
      }

      .emb-navbar-user {
        display: none;
      }

      .emb-navbar-divider {
        display: none;
      }

  </style>

<body class="bg-[#FAF8F5]">

        </svg>

    <div class="emb-navbar-right">
      <a id="nav-upload-link" href="staff_upload.html" class="hidden rounded-lg px-3 py-2 text-sm text-[#70675D] hover:bg-[#EFECE6] hover:text-[#3D3730] transition">
        อัปโหลดเอกสาร
      </a>

        </svg>

  <!-- Access-denied toast (shown on redirect from admin page) -->
  <div id="emb-toast" class="emb-toast" role="alert" aria-live="assertive">
    <svg class="emb-toast-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd"
        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z"
        clip-rule="evenodd" />
    </svg>
    <span id="emb-toast-text"></span>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ===== Auth Session =====
    const AUTH_KEY = 'emb_session';
    function getSession() {
      try { return JSON.parse(sessionStorage.getItem(AUTH_KEY)); } catch { return null; }
    }

    function fetchWithSession(url, options = {}) {
      return fetch(url, { ...options, credentials: 'include' });
    }

    // Populate navbar from session
    (function initNavbar() {
      const s = getSession();
      if (!s) return;
      const nameEl = document.getElementById('nav-user-name');
      const roleEl = document.getElementById('nav-user-role');
      const uploadLink = document.getElementById('nav-upload-link');
      if (nameEl) nameEl.textContent = s.name || s.email || '-';
      if (roleEl) roleEl.textContent = s.faculty ? s.faculty : (s.role === 'admin' ? 'เจ้าหน้าที่' : 'อาจารย์');
      if (uploadLink && s.role === 'admin') uploadLink.classList.remove('hidden');
    })();

    // Logout handler
    document.getElementById('nav-logout-btn').addEventListener('click', async function () {
      sessionStorage.removeItem(AUTH_KEY);
      try {
        await fetch(`${API_BASE_URL}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } finally {
        window.location.replace('login.html');
      }
    });

    // Show redirect notice if any
    (function checkNotice() {
      const msg = sessionStorage.getItem('emb_redirect_notice');
      if (msg) {
        sessionStorage.removeItem('emb_redirect_notice');
        const toast = document.getElementById('emb-toast');
        const toastTx = document.getElementById('emb-toast-text');
        toastTx.textContent = msg;
        toast.classList.add('visible');
        setTimeout(() => toast.classList.remove('visible'), 3500);
      }
    })();
    const API_BASE_URL = ['null', 'http://localhost:5500', 'http://127.0.0.1:5500'].includes(window.location.origin)
      ? 'http://localhost:5000'
      : window.location.origin;

    function DocumentPreviewModal({ document: doc, isOpen, onClose }) {
      const [currentFileIndex, setCurrentFileIndex] = useState(0);
      const [zoom, setZoom] = useState(100);
      const [currentPage, setCurrentPage] = useState(1);
      const [totalPages, setTotalPages] = useState(99);
      const [pdfDoc, setPdfDoc] = useState(null);
      const [isPdf, setIsPdf] = useState(false);
      const [isImage, setIsImage] = useState(false);
      const canvasRef = useRef(null);

      const filesList = doc && doc.files && doc.files.length > 0
        ? doc.files
        : doc
          ? [{
            id: doc.id || 'f-1',
            name: doc.file_name || doc.fileName || `${doc.title || 'เอกสาร'}.pdf`,
            url: doc.file_url
              ? new URL(doc.file_url, API_BASE_URL).toString()
              : doc.fileUrl || null,
            file_type: doc.file_type || doc.fileType || '',
            totalPages: doc.totalPages || 99,
          }]
          : [];

      const activeFile = filesList[currentFileIndex] || filesList[0];
      const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const lastWheelTurnRef = useRef(0);

      useEffect(() => {
        if (isOpen && doc) {
          setCurrentFileIndex(0);
          setZoom(100);
          setPanOffset({ x: 0, y: 0 });
          setCurrentPage(1);
          setTotalPages(filesList[0]?.totalPages || 99);
          loadFilePreview(filesList[0]);
        }
      }, [isOpen, doc]);

      const loadFilePreview = (fileItem) => {
        if (!fileItem) return;

        setZoom(100);
        setPanOffset({ x: 0, y: 0 });
        setCurrentPage(1);
        setTotalPages(fileItem.totalPages || 99);

        const fileSrc = fileItem.url || '';
        const fileType = fileItem.file_type || fileItem.type || '';
        const isPdfFile = fileType === 'application/pdf' || /\.pdf(?:$|[?#])/i.test(fileSrc);
        const isImageFile = /^image\/(png|jpe?g)$/i.test(fileType)
          || /\.(png|jpg|jpeg)(?:$|[?#])/i.test(fileSrc);

        setPdfDoc(null);
        if (isPdfFile && fileSrc) {
          setIsPdf(true);
          setIsImage(false);
          if (window.pdfjsLib) {
            window.pdfjsLib.getDocument(fileSrc).promise.then(
              (pdf) => {
                setPdfDoc(pdf);
                setTotalPages(pdf.numPages);
              },
              () => setPdfDoc(null)
            );
          }
        } else if (isImageFile && fileSrc) {
          setIsPdf(false);
          setIsImage(true);
          setTotalPages(1);
        } else {
          setIsPdf(false);
          setIsImage(false);
        }
      };

      const renderPdfPage = useCallback(async (pageNum, pdf) => {
        if (!pdf || !canvasRef.current) return;
        try {
          const page = await pdf.getPage(pageNum);
          const canvas = canvasRef.current;
          const context = canvas.getContext('2d');
          const dpr = window.devicePixelRatio || 1;
          const baseScale = 1.5;
          const viewport = page.getViewport({ scale: baseScale * dpr });
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = '100%';
          canvas.style.height = '100%';
          await page.render({ canvasContext: context, viewport }).promise;
        } catch (error) {
          console.error(error);
        }
      }, []);

      useEffect(() => {
        if (isOpen && isPdf && pdfDoc) {
          renderPdfPage(currentPage, pdfDoc);
        }
      }, [isOpen, isPdf, pdfDoc, currentPage, renderPdfPage]);

      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
          else if (e.key === 'ArrowRight' && currentPage < totalPages) setCurrentPage(p => p + 1);
          else if (e.key === 'ArrowLeft' && currentPage > 1) setCurrentPage(p => p - 1);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, currentPage, totalPages, onClose]);

      // Global mouse move & up listeners for fluid dragging
      useEffect(() => {
        if (!isDragging) return;
        const handleMouseMove = (e) => {
          setPanOffset({
            x: e.clientX - dragStartRef.current.x,
            y: e.clientY - dragStartRef.current.y
          });
        };
        const handleMouseUp = () => {
          setIsDragging(false);
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      if (!isOpen || !doc) return null;

      const handleZoomIn = () => setZoom(p => Math.min(p + 25, 200));
      const handleZoomOut = () => setZoom(p => Math.max(p - 25, 50));
      const handlePrevPage = () => {
        if (currentPage > 1) {
          setCurrentPage(p => p - 1);
          setPanOffset({ x: 0, y: 0 });
        }
      };
      const handleNextPage = () => {
        if (currentPage < totalPages) {
          setCurrentPage(p => p + 1);
          setPanOffset({ x: 0, y: 0 });
        }
      };

      const handlePrevDocument = () => {
        if (currentFileIndex > 0) {
          const nextIndex = currentFileIndex - 1;
          setCurrentFileIndex(nextIndex);
          setTotalPages(filesList[nextIndex].totalPages || 99);
          setCurrentPage(1);
          setPanOffset({ x: 0, y: 0 });
          loadFilePreview(filesList[nextIndex]);
        }
      };

      const handleNextDocument = () => {
        if (currentFileIndex < filesList.length - 1) {
          const nextIndex = currentFileIndex + 1;
          setCurrentFileIndex(nextIndex);
          setTotalPages(filesList[nextIndex].totalPages || 99);
          setCurrentPage(1);
          setPanOffset({ x: 0, y: 0 });
          loadFilePreview(filesList[nextIndex]);
        }
      };

      const handleDownload = (e) => {
        e.stopPropagation();
        const activeFileItem = filesList[currentFileIndex] || filesList[0];
        const fileId = (activeFileItem && activeFileItem.id) || doc.id;
        const downloadUrl = `${API_BASE_URL}/api/v1/documents/${fileId}/file?download=true`;
        window.open(downloadUrl, '_blank');
      };

      // Mouse drag start
      const handleMouseDown = (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        setIsDragging(true);
        dragStartRef.current = {
          x: e.clientX - panOffset.x,
          y: e.clientY - panOffset.y
        };
      };

      // Double-click to toggle zoom between 100% and 140%
      const handleDoubleClick = (e) => {
        e.stopPropagation();
        if (zoom !== 100 || panOffset.x !== 0 || panOffset.y !== 0) {
          setZoom(100);
          setPanOffset({ x: 0, y: 0 });
        } else {
          setZoom(140);
        }
      };

      // Mouse wheel handler: Ctrl+Wheel zooms, zoom > 100 scrolls/pans, zoom <= 100 flips pages
      const handleWheel = (e) => {
        e.stopPropagation();

        // Ctrl + wheel or pinch-to-zoom
        if (e.ctrlKey) {
          e.preventDefault();
          if (e.deltaY < 0) {
            setZoom(prev => Math.min(prev + 15, 200));
          } else if (e.deltaY > 0) {
            setZoom(prev => Math.max(prev - 15, 50));
          }
          return;
        }

        // When zoomed in: roll wheel scrolls document vertically (or horizontally with Shift)
        if (zoom > 100) {
          e.preventDefault();
          const scrollFactor = 0.85;
          const maxBoundY = ((zoom / 100) - 1) * 360;
          const maxBoundX = ((zoom / 100) - 1) * 260;

          setPanOffset(prev => {
            let deltaY = e.deltaY;
            let deltaX = e.deltaX || 0;
            if (e.shiftKey) {
              deltaX = deltaY;
              deltaY = 0;
            }

            let newY = prev.y - deltaY * scrollFactor;
            let newX = prev.x - deltaX * scrollFactor;

            newY = Math.max(-maxBoundY - 40, Math.min(maxBoundY + 40, newY));
            newX = Math.max(-maxBoundX - 40, Math.min(maxBoundX + 40, newX));

            // Page flip at top/bottom boundary
            const now = Date.now();
            if (now - lastWheelTurnRef.current > 400) {
              if (deltaY > 25 && prev.y <= -maxBoundY + 10 && currentPage < totalPages) {
                lastWheelTurnRef.current = now;
                setCurrentPage(p => p + 1);
                return { x: 0, y: maxBoundY };
              } else if (deltaY < -25 && prev.y >= maxBoundY - 10 && currentPage > 1) {
                lastWheelTurnRef.current = now;
                setCurrentPage(p => p - 1);
                return { x: 0, y: -maxBoundY };
              }
            }

            return { x: newX, y: newY };
          });
        } else {
          // Normal zoom: roll wheel flips page
          const now = Date.now();
          if (now - lastWheelTurnRef.current > 260) {
            if (e.deltaY > 20 && currentPage < totalPages) {
              lastWheelTurnRef.current = now;
              setCurrentPage(p => p + 1);
              setPanOffset({ x: 0, y: 0 });
            } else if (e.deltaY < -20 && currentPage > 1) {
              lastWheelTurnRef.current = now;
              setCurrentPage(p => p - 1);
              setPanOffset({ x: 0, y: 0 });
            }
          }
        }
      };

      return (
        <div
          id="preview-modal-overlay"
          className="fixed inset-0 z-50 flex flex-col justify-between bg-black/80 backdrop-blur-xs font-['Prompt',sans-serif] select-none animate-fade-in cursor-pointer"
          onClick={onClose}
        >
          {/* Top Header */}
          <div
            className="w-full flex items-start justify-between p-6 sm:p-8 shrink-0 cursor-pointer"
            onClick={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              className="max-w-2xl text-white space-y-1 pr-4 cursor-default"
              onClick={(e) => e.stopPropagation()}
            >
              <h2 className="text-base sm:text-xl font-normal leading-snug tracking-tight text-white">
                {doc.title}
              </h2>
              <p className="text-xs sm:text-sm text-white/80 font-light">
                ได้รับ {doc.document_date || doc.uploaded_at || '-'}
              </p>
              <p className="text-xs sm:text-sm text-white/80 font-light">
                จาก {doc.sender}
              </p>
              {filesList.length > 1 && (
                <p className="text-xs text-[#E8E4DC] font-light bg-white/15 inline-block px-3 py-0.5 rounded-full mt-1">
                  ไฟล์ที่ {currentFileIndex + 1} จาก {filesList.length}: {activeFile?.name}
                </p>
              )}
            </div>

            <button
              id="btn-modal-close"
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                onClose();
              }}
              className="text-white/80 hover:text-white transition p-2 text-2xl sm:text-3xl leading-none cursor-pointer shrink-0"
              title="ปิด (Esc หรือคลิกพื้นหลัง)"
            >
              ✕
            </button>
          </div>

          {/* Center: A4 Paper Preview Canvas with Left & Right Document Switch Buttons */}
          <div
            className="flex-1 flex items-center justify-center p-4 min-h-0 relative cursor-pointer overflow-hidden"
            onClick={onClose}
            onWheel={handleWheel}
          >
            {filesList.length > 1 && (
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  handlePrevDocument();
                }}
                disabled={currentFileIndex <= 0}
                className="absolute left-4 sm:left-12 z-20 w-11 h-11 sm:w-13 sm:h-13 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center text-2xl font-bold shadow-xl transition disabled:opacity-20 disabled:cursor-default cursor-pointer backdrop-blur-md"
                title="เอกสารก่อนหน้า"
              >
                ‹
              </button>
            )}

            {/* True Portrait A4 Paper (Height dominant with 1 : 1.4142 portrait ratio) */}
            <div
              onMouseDown={handleMouseDown}
              onDoubleClick={handleDoubleClick}
              className={`h-[74vh] max-h-[750px] w-auto aspect-[1/1.414] max-w-[90vw] bg-white rounded shadow-2xl border border-white/20 relative flex items-center justify-center overflow-hidden transition-transform duration-75 select-none shrink-0 ${isDragging ? 'cursor-grabbing' : (zoom > 100 ? 'cursor-grab' : 'cursor-default')
                }`}
              style={{
                transform: `translate(${panOffset.x}px, ${panOffset.y}px) scale(${zoom / 100})`,
                transformOrigin: 'center center'
              }}
              onClick={(e) => e.stopPropagation()}
            >
              {isPdf && pdfDoc ? (
                <canvas ref={canvasRef} className="max-w-full max-h-full object-contain pointer-events-none select-none" />
              ) : isImage && activeFile && activeFile.url ? (
                <img src={activeFile.url} alt="Preview" className="max-w-full max-h-full object-contain pointer-events-none select-none" />
              ) : (

            onClick={(e) => e.stopPropagation()}

            <div className="flex items-center gap-2 sm:gap-3 z-10">
              <button
                id="btn-modal-zoom-out"
                type="button"
                onClick={handleZoomOut}
                disabled={zoom <= 50}
                className="hover:text-white px-2.5 py-1 rounded hover:bg-white/15 transition cursor-pointer disabled:opacity-30 disabled:cursor-default text-base font-medium"
                title="ย่อ"
              >
                -
              </button>
              <span className="font-light min-w-[45px] text-center">{zoom}%</span>
              <button
                id="btn-modal-zoom-in"
                type="button"

                disabled={zoom >= 200}
                className="hover:text-white px-2.5 py-1 rounded hover:bg-white/15 transition cursor-pointer disabled:opacity-30 disabled:cursor-default text-base font-medium"
                title="ขยาย"
              >
                +
              </button>
              {zoom !== 100 && (
                <button
                  type="button"
                  onClick={() => { setZoom(100); setPanOffset({ x: 0, y: 0 }); }}
                  className="text-[11px] text-white/80 hover:text-white underline ml-1 cursor-pointer transition"
                  title="รีเซ็ตขนาด"
                >
                  รีเซ็ต
                </button>
              )}
            </div>

            {/* Center: Exactly Centered Page Counter */}
            <div className="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 z-10">
              {totalPages > 1 && (
                <button
                  type="button"
                  onClick={handlePrevPage}
                  disabled={currentPage <= 1}
                  className="hover:text-white px-2 py-0.5 rounded hover:bg-white/15 transition disabled:opacity-30 cursor-pointer text-sm"
                  title="หน้าก่อนหน้า"
                >
                  ◀
                </button>
              )}
              <span className="font-light tracking-wide text-center whitespace-nowrap">
                หน้า {currentPage} จาก {totalPages}
              </span>
              {totalPages > 1 && (
                <button
                  type="button"
                  onClick={handleNextPage}
                  disabled={currentPage >= totalPages}
                  className="hover:text-white px-2 py-0.5 rounded hover:bg-white/15 transition disabled:opacity-30 cursor-pointer text-sm"
                  title="หน้าถัดไป"
                >
                  ▶
                </button>
              )}
            </div>

            {/* Right: Download Button */}
            <div className="z-10">
              <button
                id="btn-modal-download"
                type="button"
                onClick={handleDownload}
                className="text-white/80 hover:text-white hover:bg-white/15 p-2 rounded-lg transition cursor-pointer"
                title="ดาวน์โหลดเอกสาร"
              >
                <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.6">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Trie Search Helpers ---
    function walkTrie(trieData, prefix) {
      if (!trieData || !prefix) return null;
      const chars = prefix.toLowerCase().split('');
      let node = trieData;
      for (const ch of chars) {
        if (!node[ch]) return new Set();
        node = node[ch];
      }
      return collectTrieIds(node);
    }

    function collectTrieIds(node) {
      const ids = new Set(node['$'] || []);
      for (const [key, child] of Object.entries(node)) {
        if (key !== '$') {
          for (const id of collectTrieIds(child)) ids.add(id);
        }
      }
      return ids;
    }

    // --- Highlight Text Helper ---
    function HighlightText({ text, query }) {
      if (!text) return '-';
      if (!query || !query.trim()) return text;

      const words = query.trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return text;

      const escaped = words.map(w => w.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&')).join('|');
      const regex = new RegExp(`(${escaped})`, 'gi');
      const parts = String(text).split(regex);

      return (
        <span>
          {parts.map((part, index) => {
            const isMatch = words.some(w => w.toLowerCase() === part.toLowerCase());
            return isMatch ? (
              <mark key={index} className="bg-[#F5E6B3] text-[#2B251F] font-medium px-0.5 rounded-xs">
                {part}
              </mark>
            ) : (
              part
            );
          })}
        </span>
      );
    }

    function LecturerDocumentViewApp() {
      const [viewState, setViewState] = useState('loading');
      const [documents, setDocuments] = useState([]);
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [openMenuId, setOpenMenuId] = useState(null);
      const [editingDoc, setEditingDoc] = useState(null);
      const [editForm, setEditForm] = useState({ title: '', document_date: '', sender: '', receiver: '' });
      const [replacementFile, setReplacementFile] = useState(null);
      const [isSavingEdit, setIsSavingEdit] = useState(false);
      const [editError, setEditError] = useState('');
      const [confirmingDelete, setConfirmingDelete] = useState(null);
      const [deleteConfirmation, setDeleteConfirmation] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);
      const [deleteError, setDeleteError] = useState('');
      const [successMessage, setSuccessMessage] = useState('');
      const isAdmin = getSession()?.role === 'admin';

      const showSuccessMessage = (message) => {
        setSuccessMessage(message);
        setTimeout(() => setSuccessMessage(''), 3000);
      };

      // --- Trie Search State ---
      const [searchQuery, setSearchQuery] = useState('');
      const [trieData, setTrieData] = useState(null);
      const [searchMatchIds, setSearchMatchIds] = useState(null);

      function groupDocuments(rawDocs) {
        const map = new Map();
        rawDocs.forEach(doc => {
          const key = `${(doc.title || '').trim()}__${(doc.sender || '').trim()}__${(doc.receiver || '').trim()}__${(doc.document_date || '').trim()}`;
          const fileEntry = {
            id: doc.id,
            name: doc.file_name || `${doc.title || 'เอกสาร'}.pdf`,
            url: doc.file_url ? new URL(doc.file_url, API_BASE_URL).toString() : `${API_BASE_URL}/api/v1/documents/${doc.id}/file`,
            file_type: doc.file_type || '',
            file_size: doc.file_size || 0,
            uploaded_at: doc.uploaded_at
          };

          if (map.has(key)) {
            const existing = map.get(key);
            existing.files.push(fileEntry);
          } else {
            map.set(key, {
              ...doc,
              files: [fileEntry]
            });
          }
        });
        return sortDocumentsByDate(Array.from(map.values()));
      }

      function sortDocumentsByDate(documentList) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const distanceFromToday = (document) => {
          const date = new Date(`${document.document_date}T00:00:00`);
          return Number.isNaN(date.getTime()) ? Number.POSITIVE_INFINITY : Math.abs(date - today);
        };

        return [...documentList].sort((left, right) =>
          distanceFromToday(left) - distanceFromToday(right)
        );
      }

      const filteredDocuments = searchMatchIds === null
        ? documents
        : documents.filter(d => searchMatchIds.has(d.id) || (d.files && d.files.some(f => searchMatchIds.has(f.id))));

      const handleOpenModal = (doc) => {
        setSelectedDoc(doc);
        setIsModalOpen(true);
      };

      const handleCloseModal = () => {
        setIsModalOpen(false);
        setSelectedDoc(null);
      };

      const handleDirectDownload = (doc) => {
        const fileId = (doc.files && doc.files.length > 0) ? doc.files[0].id : doc.id;
        const downloadUrl = `${API_BASE_URL}/api/v1/documents/${fileId}/file?download=true`;
        window.open(downloadUrl, '_blank');
      };

      const handleStartEdit = (doc) => {
        setEditForm({
          title: doc.title || '',
          document_date: doc.document_date || '',
          sender: doc.sender || '',
          receiver: doc.receiver || '',
        });
        setReplacementFile(null);
        setEditError('');
        setEditingDoc(doc);
        setOpenMenuId(null);
      };

      const handleSaveEdit = async (event) => {
        event.preventDefault();
        if (!editingDoc) return;

        setIsSavingEdit(true);
        setEditError('');
        const body = new FormData();
        Object.entries(editForm).forEach(([field, value]) => body.append(field, value));
        if (replacementFile) body.append('file', replacementFile);

        try {
          const response = await fetchWithSession(`${API_BASE_URL}/api/v1/documents/${editingDoc.id}`, {
            method: 'PATCH',
            body,
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error?.message || 'อัปเดตเอกสารไม่สำเร็จ');

          setDocuments((current) => sortDocumentsByDate(current.map((doc) =>
            doc.id === editingDoc.id ? result.document : doc
          )));
          setEditingDoc(null);
          setReplacementFile(null);
          showSuccessMessage('Update complete');
        } catch (error) {
          setEditError(error.message || 'อัปเดตเอกสารไม่สำเร็จ');
        } finally {
          setIsSavingEdit(false);
        }
      };

      const handleRequestDelete = (doc) => {
        setOpenMenuId(null);
        setDeleteConfirmation('');
        setDeleteError('');
        setConfirmingDelete(doc);
      };

      const handleDeleteDocument = async () => {
        if (!confirmingDelete || deleteConfirmation !== confirmingDelete.title) return;

        setIsDeleting(true);
        setDeleteError('');
        try {
          const fileIds = confirmingDelete.files?.map(file => file.id) || [confirmingDelete.id];
          for (const fileId of fileIds) {
            const response = await fetchWithSession(`${API_BASE_URL}/api/v1/documents/${fileId}`, { method: 'DELETE' });
            if (!response.ok) {
              const result = await response.json().catch(() => ({}));
              throw new Error(result.error?.message || 'ลบเอกสารไม่สำเร็จ');
            }
          }

          const response = await fetchWithSession(`${API_BASE_URL}/api/v1/documents`);
          if (!response.ok) throw new Error('ลบเอกสารแล้ว แต่โหลดรายการใหม่ไม่สำเร็จ');
          const data = await response.json();
          const updatedDocuments = groupDocuments(data.documents || []);
          setDocuments(updatedDocuments);
          setViewState(updatedDocuments.length > 0 ? 'data' : 'empty');
          if (selectedDoc?.id === confirmingDelete.id) handleCloseModal();
          setConfirmingDelete(null);
          showSuccessMessage('Delete complete');
        } catch (error) {
          setDeleteError(error.message || 'ลบเอกสารไม่สำเร็จ');
        } finally {
          setIsDeleting(false);
        }
      };

      useEffect(() => {
        let isMounted = true;

        async function fetchDocuments() {
          setViewState('loading');
          try {
            const response = await fetchWithSession(`${API_BASE_URL}/api/v1/documents`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            const rawList = data.documents || [];
            const list = groupDocuments(rawList);

            if (isMounted) {
              setDocuments(list);
              setViewState(list.length > 0 ? 'data' : 'empty');
            }
          } catch (error) {
            if (isMounted) {
              setDocuments([]);
              setViewState('empty');
            }
          }
        }

        fetchDocuments();
        return () => {
          isMounted = false;
        };
      }, []);

      // Fetch trie index for search
      useEffect(() => {
        fetchWithSession(`${API_BASE_URL}/api/v1/search/trie`)
          .then(r => r.json())
          .then(data => setTrieData(data.trie))
          .catch(() => { });
      }, []);

      // Filter documents when search query changes
      useEffect(() => {
        const trimmed = searchQuery.trim();
        if (!trimmed) {
          setSearchMatchIds(null);
          return;
        }
        const words = trimmed.toLowerCase().split(/\s+/);
        let resultSet = null;
        for (const word of words) {
          const ids = walkTrie(trieData, word);
          if (ids === null) continue;
          if (resultSet === null) {
            resultSet = ids;
          } else {
            resultSet = new Set([...resultSet].filter(id => ids.has(id)));
          }
        }
        setSearchMatchIds(resultSet);
      }, [searchQuery, trieData]);

      // Get session info for display
      const session = getSession();
      const displayName = session ? (session.name || session.email || 'อาจารย์') : 'อาจารย์';
      const displayFaculty = session ? (session.faculty || '') : '';

      return (
        <div className="min-h-screen w-full bg-[#FAF8F5] p-6 sm:p-10 lg:p-14 font-['Prompt',sans-serif] text-[#3D3730] relative">
          {successMessage && (
            <div role="status" className={`fixed top-20 left-1/2 z-40 -translate-x-1/2 rounded-xl ${successMessage === 'Delete complete' ? 'bg-red-600' : 'bg-[#6BBF72]'} px-6 py-3 text-sm text-white shadow-lg`}>
              {successMessage}
            </div>
          )}
          <DocumentPreviewModal
            document={selectedDoc}
            isOpen={isModalOpen}
            onClose={handleCloseModal}
          />

          {confirmingDelete && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 p-4">
              <div className="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
                <h2 className="text-lg font-medium text-[#3D3730]">ยืนยันการลบเอกสาร</h2>
                <p className="mt-3 text-sm text-[#70675D]">
                  การลบนี้ไม่สามารถย้อนกลับได้ พิมพ์ชื่อเอกสารด้านล่างเพื่อยืนยัน:
                </p>
                <p className="mt-2 break-words rounded-lg bg-[#F5F2EC] px-3 py-2 text-sm font-medium text-[#3D3730]">
                  {confirmingDelete.title}
                </p>
                <input
                  type="text"
                  value={deleteConfirmation}
                  onChange={(event) => setDeleteConfirmation(event.target.value)}
                  placeholder="พิมพ์ชื่อเอกสารให้ตรงกัน"
                  className="mt-3 w-full rounded-lg border border-[#D5CEC4] px-3 py-2 text-sm text-[#3D3730] focus:outline-none focus:border-[#8C8176]"
                  autoFocus
                />
                {deleteError && <p role="alert" className="mt-2 text-sm text-red-600">{deleteError}</p>}
                <div className="mt-5 flex justify-end gap-2">
                  <button type="button" onClick={() => setConfirmingDelete(null)} disabled={isDeleting} className="rounded-lg bg-[#EFECE6] px-4 py-2 text-sm text-[#554E45] disabled:opacity-60">ยกเลิก</button>
                  <button type="button" onClick={handleDeleteDocument} disabled={isDeleting || deleteConfirmation !== confirmingDelete.title} className="rounded-lg bg-red-600 px-4 py-2 text-sm text-white disabled:opacity-50">
                    {isDeleting ? 'กำลังลบ...' : 'ลบเอกสาร'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingDoc && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
              <form onSubmit={handleSaveEdit} className="w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl">
                <div className="mb-5 flex items-center justify-between">
                  <h2 className="text-lg font-medium text-[#3D3730]">แก้ไขเอกสาร</h2>
                  <button type="button" onClick={() => setEditingDoc(null)} className="rounded-lg p-2 text-[#70675D] hover:bg-[#EFECE6]" aria-label="ปิด">✕</button>
                </div>
                <div className="space-y-3">
                  <label className="block text-sm text-[#70675D]">ชื่อเรื่อง
                    <input required value={editForm.title} onChange={(e) => setEditForm({ ...editForm, title: e.target.value })} className="mt-1 w-full rounded-lg border border-[#D5CEC4] px-3 py-2 text-[#3D3730]" />
                  </label>
                  <label className="block text-sm text-[#70675D]">วันที่เอกสาร
                    <input required type="date" value={editForm.document_date} onChange={(e) => setEditForm({ ...editForm, document_date: e.target.value })} className="mt-1 w-full rounded-lg border border-[#D5CEC4] px-3 py-2 text-[#3D3730]" />
                  </label>
                  <label className="block text-sm text-[#70675D]">ผู้ส่ง
                    <input required value={editForm.sender} onChange={(e) => setEditForm({ ...editForm, sender: e.target.value })} className="mt-1 w-full rounded-lg border border-[#D5CEC4] px-3 py-2 text-[#3D3730]" />
                  </label>
                  <label className="block text-sm text-[#70675D]">ผู้รับ
                    <input required value={editForm.receiver} onChange={(e) => setEditForm({ ...editForm, receiver: e.target.value })} className="mt-1 w-full rounded-lg border border-[#D5CEC4] px-3 py-2 text-[#3D3730]" />
                  </label>
                  <label className="block text-sm text-[#70675D]">เปลี่ยนไฟล์ (ไม่เลือกไฟล์เพื่อใช้ไฟล์เดิม)
                    <input type="file" accept=".pdf,.png,.jpg,.jpeg" onChange={(e) => setReplacementFile(e.target.files?.[0] || null)} className="mt-1 block w-full text-sm" />
                  </label>
                  {editError && <p role="alert" className="text-sm text-red-600">{editError}</p>}
                </div>
                <div className="mt-6 flex justify-end gap-2">
                  <button type="button" onClick={() => setEditingDoc(null)} className="rounded-lg bg-[#EFECE6] px-4 py-2 text-sm text-[#554E45]">ยกเลิก</button>
                  <button type="submit" disabled={isSavingEdit} className="rounded-lg bg-[#8C8176] px-4 py-2 text-sm text-white disabled:opacity-60">
                    {isSavingEdit ? 'กำลังบันทึก...' : 'บันทึกการแก้ไข'}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Dev state switcher — only visible for developer testing */}
          {false && (
            <div className="fixed bottom-3 right-4 z-40 bg-white/95 backdrop-blur border border-[#D5CEC4] rounded-xl px-3 py-2 shadow-md flex flex-wrap items-center gap-2 text-xs">
              <button onClick={() => setViewState('data')} className="bg-[#EFECE6] text-[#70675D] px-2.5 py-1 rounded-lg">Data</button>
              <button onClick={() => setViewState('loading')} className="bg-[#EFECE6] text-[#70675D] px-2.5 py-1 rounded-lg">Loading</button>
              <button onClick={() => setViewState('empty')} className="bg-[#EFECE6] text-[#70675D] px-2.5 py-1 rounded-lg">Empty</button>
            </div>
          )}

          <div className="max-w-6xl mx-auto">
            <div className="mb-6 sm:mb-8">
              <p className="text-xs text-[#9E9689] font-light mb-1 tracking-wide uppercase" style={{ letterSpacing: '0.08em' }}>กล่องเอกสารของฉัน</p>
              <h1 className="text-2xl sm:text-3xl font-normal text-[#4A433B] tracking-tight mb-1">
                {displayName}
              </h1>
              {displayFaculty && (
                <p className="text-xs sm:text-sm text-[#70675D] font-light">
                  {displayFaculty}
                </p>
              )}
            </div>

            <div className="w-full bg-white rounded-2xl shadow-xs border border-[#E8E4DC] p-5 sm:p-8 min-h-[480px] flex flex-col justify-start">
              {/* Search Bar */}
              <div className="mb-4">
                <div className="flex items-center gap-2 bg-[#F1EDE6] rounded-xl px-4 py-2.5 border border-transparent focus-within:border-[#C8C1B6] focus-within:bg-[#EBE6DE] transition">
                  <svg className="w-4 h-4 text-[#9E9689] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.8">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                  </svg>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="ค้นหาเอกสาร..."
                    className="w-full bg-transparent text-[#3D3730] placeholder-[#9E9689] text-sm focus:outline-none"
                  />
                  {searchQuery && (
                    <button
                      type="button"
                      onClick={() => setSearchQuery('')}
                      className="text-[#9E9689] hover:text-[#3D3730] text-xs cursor-pointer"
                    >
                      ✕
                    </button>
                  )}
                </div>
                {searchQuery && filteredDocuments.length === 0 && viewState !== 'loading' && (
                  <p className="text-xs text-[#9E9689] mt-2 ml-1">ไม่พบเอกสารที่ตรงกับ "{searchQuery}"</p>

              </div>

              <div className="w-full grid grid-cols-12 pb-3 mb-3 border-b border-[#EFECE6] text-xs sm:text-sm text-[#70675D] font-normal select-none">
                <div className="col-span-12 md:col-span-4 pl-3">ชื่อเรื่อง</div>
                <div className="hidden md:block md:col-span-3 text-left">วันที่ได้รับ</div>
                <div className="hidden md:block md:col-span-2 text-left">ผู้รับ</div>
                <div className="hidden md:block md:col-span-2 text-left">ผู้ส่ง</div>
                <div className="col-span-12 md:col-span-1 text-right pr-2"></div>
              </div>

              {viewState === 'loading' && (
                <div className="space-y-3 w-full animate-pulse">
                  {[1, 2, 3].map((item) => (
                    <div
                      key={item}
                      className="w-full grid grid-cols-12 items-center p-3 sm:p-4 rounded-xl border border-[#EFECE6] bg-[#FAF8F5]/40"
                    >
                      <div className="col-span-12 md:col-span-4 pr-4"><div className="h-4 sm:h-5 bg-[#D5CEC4]/70 rounded-full w-4/5"></div></div>
                      <div className="hidden md:block md:col-span-3 pr-4"><div className="h-4 sm:h-5 bg-[#D5CEC4]/70 rounded-full w-3/4"></div></div>
                      <div className="hidden md:block md:col-span-2 pr-4"><div className="h-4 sm:h-5 bg-[#D5CEC4]/70 rounded-full w-2/3"></div></div>
                      <div className="hidden md:block md:col-span-2 pr-4"><div className="h-4 sm:h-5 bg-[#D5CEC4]/70 rounded-full w-2/3"></div></div>
                      <div className="hidden md:flex md:col-span-1 justify-end gap-2 pr-2">
                        <div className="w-5 h-5 rounded-full bg-[#D5CEC4]/50"></div>
                        <div className="w-5 h-5 rounded-full bg-[#D5CEC4]/50"></div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {viewState === 'empty' && (
                <div className="w-full flex-1 min-h-[320px] flex items-center justify-center text-center">
                  <p className="text-lg sm:text-xl font-light text-[#9E9689] select-none">
                    ไม่มีเอกสารเข้าสู่ระบบของท่าน
                  </p>
                </div>
              )}

              {viewState === 'data' && (
                <div className="space-y-2.5 w-full">
                  {filteredDocuments.map((doc) => (
                    <div
                      key={doc.id}
                      className="w-full grid grid-cols-12 items-center p-3 sm:p-4 rounded-xl border border-[#EFECE6] bg-white hover:bg-[#FAF8F5] transition duration-150 group"
                    >
                      <div className="col-span-12 md:col-span-4 pl-3 pr-4">
                        <span
                          onClick={() => handleOpenModal(doc)}
                          className="text-xs sm:text-sm text-[#3D3730] hover:text-[#7A7067] font-normal leading-relaxed break-words cursor-pointer"
                        >
                          <HighlightText text={doc.title} query={searchQuery} />
                        </span>
                        {doc.files && doc.files.length > 1 && (
                          <span className="ml-2 text-[10px] text-[#70675D] bg-[#EFECE6] px-1.5 py-0.5 rounded-md font-light">
                            {doc.files.length} ไฟล์
                          </span>
                        )}
                      </div>

                      <div className="col-span-6 md:col-span-3 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pl-3 md:pl-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">วันที่: </span>
                        {doc.document_date || doc.uploaded_at || '-'}
                      </div>

                      <div className="col-span-6 md:col-span-2 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pr-2 break-words break-all">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">ผู้รับ: </span>
                        <HighlightText text={doc.receiver} query={searchQuery} />
                      </div>

                      <div className="col-span-6 md:col-span-2 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pl-3 md:pl-0 pr-2 break-words break-all">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">ผู้ส่ง: </span>
                        <HighlightText text={doc.sender} query={searchQuery} />
                      </div>

                      <div className="col-span-6 md:col-span-1 flex items-center justify-end gap-1 pr-2 mt-2 md:mt-0">
                        <button
                          type="button"
                          onClick={() => handleOpenModal(doc)}
                          className="text-[#70675D] hover:text-[#3D3730] hover:bg-[#EFECE6] p-1.5 rounded-lg transition cursor-pointer"
                          title="ดูตัวอย่างเอกสาร (เปิด Modal)"
                        >
                          <svg className="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.6">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                          </svg>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleDirectDownload(doc)}
                          className="text-[#70675D] hover:text-[#3D3730] hover:bg-[#EFECE6] p-1.5 rounded-lg transition cursor-pointer"
                          title="ดาวน์โหลดเอกสาร"
                        >
                          <svg className="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="1.6">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                          </svg>
                        </button>

                        {isAdmin && (
                          <div className="relative">
                            <button
                              type="button"
                              onClick={() => setOpenMenuId(openMenuId === doc.id ? null : doc.id)}
                              className="rounded-lg p-1.5 text-[#70675D] hover:bg-[#EFECE6] hover:text-[#3D3730] transition cursor-pointer"
                              aria-label={`ตัวเลือกเอกสาร ${doc.title}`}
                              aria-haspopup="menu"
                              aria-expanded={openMenuId === doc.id}
                            >
                              <svg className="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="5" cy="12" r="1.8" />
                                <circle cx="12" cy="12" r="1.8" />
                                <circle cx="19" cy="12" r="1.8" />
                              </svg>
                            </button>
                            {openMenuId === doc.id && (
                              <div role="menu" className="absolute right-0 top-full z-20 mt-1 min-w-28 rounded-lg border border-[#E8E4DC] bg-white p-1 shadow-lg">
                                <button type="button" role="menuitem" onClick={() => handleStartEdit(doc)} className="w-full rounded-md px-3 py-2 text-left text-sm text-[#3D3730] hover:bg-[#F5F2EC]">
                                  แก้ไขเอกสาร
                                </button>
                                <button type="button" role="menuitem" onClick={() => handleRequestDelete(doc)} className="w-full rounded-md px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50">
                                  ลบเอกสาร
                                </button>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LecturerDocumentViewApp />);
  </script>
</body>

</html>
